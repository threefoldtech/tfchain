name: Build and Test
on:
  push:
    branches:
      - development
    paths:
      - 'substrate-node/**'
      - '.github/workflows/010_build_and_test.yaml'
  pull_request:
    # Every step of this job works inside substrate-node: cargo build, cargo test,
    # and the robot suite in substrate-node/tests. It used to run on every pull
    # request regardless, so a JS-only change queued a full Rust build.
    paths:
      - 'substrate-node/**'
      - '.github/workflows/010_build_and_test.yaml'

# One self-hosted runner serves this workflow, and the build starts with a
# `cargo clean`, so runs are long and strictly serial. Without this, pushing three
# times to a branch queued three full builds and only the last one's result
# mattered. Superseding an in-progress build for the same ref is safe: the newest
# commit is what the pull request is judged on.
concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: [self-hosted, tfchainrunner01]
    container:
      image: threefolddev/tfchain:5
      env:
        DEBIAN_FRONTEND: noninteractive
        PATH: /root/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/go/bin
        RUSTUP_HOME: /root/.rustup
        CARGO_HOME: /root/.cargo

    steps:
      - uses: actions/checkout@v3

      - name: Chown user
        run: |
          chown -R $USER:$USER $GITHUB_WORKSPACE

      - name: Cache build
        uses: actions/cache@v3
        timeout-minutes: 6
        continue-on-error: true
        with:
          path: |
            /root/.cargo/bin/
            /root/.cargo/registry/index/
            /root/.cargo/registry/cache/
            /root/.cargo/git/db/
            substrate-node/target/
          key: ${{ runner.os }}-tfchain-build-cache-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-tfchain-build-cache

      - name: Build
        run: |
          cd substrate-node
          cargo clean
          cargo build --release

      - name: Unit tests
        run: |
          cd substrate-node
          cargo test --no-fail-fast --features runtime-benchmarks

      - name: Integration tests
        if: "!contains(github.event.head_commit.message, '[skip integr]')"
        run: |
          python3.10 -m pip install robotframework==5.0.1 cryptography==3.4.8 substrate-interface==1.4.0
          cd substrate-node/tests
          robot -d _output_tests/ .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration test output
          path: substrate-node/tests/_output_tests/
