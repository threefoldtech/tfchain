[package]
name = "tfchain-client"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"

[lib]
path = "src/lib.rs"
name = "tfchain_client"

[dependencies]
subxt = "0.44"
subxt-signer = { version = "0.44", features = ["sr25519", "subxt"] }
bip39 = "2.1"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "time"] }
futures = "0.3"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
thiserror = "2.0"

[dev-dependencies]
anyhow = "1.0"
